[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qphys"
version = "0.3.0"
description = "Quantum formalism as a modeling language: collapse models for time series, and learning the law from trajectories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dror Jacoby" }]
keywords = [
    "quantum causal states", "hidden quantum Markov models",
    "computational mechanics", "Leggett-Garg", "physics-informed machine learning",
    "law discovery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# The classical baselines the quantum models must beat at matched capacity.
baselines = ["hmmlearn>=0.3", "statsmodels>=0.14", "scikit-learn>=1.4"]
# Project 2's networks.
nn = ["torch>=2.0"]
# Continuous measurement (Project 1 extension) and sparse regression.
quantum = ["qutip>=5.0", "pysindy>=2.0"]
notebooks = ["nbformat", "nbconvert", "jupyter", "ipykernel"]
dev = [
    "qphys[baselines,nn,quantum,notebooks]",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "pre-commit>=3.5",
]
all = ["qphys[baselines,nn,quantum,notebooks]"]

[project.urls]
Homepage = "https://github.com/drorjac/qphys"
Repository = "https://github.com/drorjac/qphys"
Issues = "https://github.com/drorjac/qphys/issues"
Changelog = "https://github.com/drorjac/qphys/blob/main/docs/CHANGELOG.md"

[project.scripts]
qphys = "qphys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qphys = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running (seed sweeps, network training)",
    "network: needs the internet on a cold cache",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF", "SIM", "RET"]
ignore = ["E501", "RET504", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Physics code: `c` is the speed of light, `L` a Lagrangian, `E` an energy.
"src/qphys/**" = ["E741", "N806"]
"tests/**" = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["qphys"]

# --------------------------------------------------------------------------
[tool.mypy]
# The analysis target, not the supported floor: numpy's bundled stubs use
# `type` statements, which mypy only parses at 3.12+.
python_version = "3.12"
files = ["src/qphys"]
mypy_path = "src"
explicit_package_bases = true
# The scientific stack is largely untyped; this package is typed at its own
# boundaries and does not pretend numpy/scipy/torch are.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
